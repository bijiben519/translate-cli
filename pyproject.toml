[project]
name = "translate-cli"
version = "0.1.0"
description = "A terminal translation tool using Google Translate"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "deep-translator>=1.11",
    "langdetect>=1.0",
]

[project.optional-dependencies]
offline = ["argostranslate>=1.9"]

[project.scripts]
translate = "translate_cli.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
