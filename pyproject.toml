[project]
name = "translate-cli"
version = "1.0.0"
description = "A terminal translation tool using Google Translate"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "deep-translator>=1.11",
    "langdetect>=1.0",
]
authors = [
    {name = "Jinbi"}
]
readme = {content-type = "text/markdown", text = """\
# translate-cli

A simple terminal translation tool powered by Google Translate.

## Install

```bash
pipx install translate-cli
```

## Usage

```bash
# Smart default: auto-detect en/zh-CN
translate "hello"        # 你好
translate "你好"          # Hello

# Specify source and target
translate "bonjour" -s fr -t en   # hello

# Pipe from stdin
echo "hola" | translate -t en     # hello

# Copy to clipboard
translate "hello" -c

# Detect language
translate --detect "bonjour"      # fr

# List supported languages
translate --languages
```
"""}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.scripts]
translate = "translate_cli.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
